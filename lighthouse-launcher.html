<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #02030a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Josefin Sans', sans-serif;
    cursor: none;
  }
  canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  #splash {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    animation: fadeIn 1.8s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  #logo-wrap {
    position: relative;
    width: clamp(160px, 22vw, 260px);
    height: clamp(160px, 22vw, 260px);
    cursor: none;
  }

  /* Outer ring pulses */
  #logo-wrap::before, #logo-wrap::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: ringPulse 3s ease-in-out infinite;
  }
  #logo-wrap::before {
    width: 115%; height: 115%;
    border-color: rgba(0,230,255,0.25);
    animation-delay: 0s;
  }
  #logo-wrap::after {
    width: 135%; height: 135%;
    border-color: rgba(200,100,255,0.15);
    animation-delay: 0.8s;
  }
  @keyframes ringPulse {
    0%, 100% { opacity: 0.3; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.8; transform: translate(-50%,-50%) scale(1.04); }
  }

  #logo-img {
    width: 100%; height: 100%;
    border-radius: 28%;
    display: block;
    transition: transform 0.3s ease, filter 0.3s ease;
    filter: drop-shadow(0 0 24px rgba(0,200,255,0.4)) drop-shadow(0 0 60px rgba(180,80,255,0.2));
    animation: logoFloat 6s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  #logo-wrap:hover #logo-img {
    filter: drop-shadow(0 0 40px rgba(0,230,255,0.7)) drop-shadow(0 0 80px rgba(200,100,255,0.4));
    transform: translateY(-6px) scale(1.04);
  }

  #title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: linear-gradient(160deg, #ffffff 0%, #b8e0ff 35%, #c8a0ff 70%, #ff9fd0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(160,180,255,0.3));
    text-align: center;
  }

  #tagline {
    font-family: 'Josefin Sans', sans-serif;
    font-size: clamp(0.55rem, 1.5vw, 0.75rem);
    letter-spacing: 0.45em;
    color: rgba(180,210,255,0.45);
    text-transform: uppercase;
    text-align: center;
    margin-top: -20px;
  }

  #enter-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid rgba(180,220,255,0.22);
    color: rgba(200,225,255,0.65);
    font-family: 'Josefin Sans', sans-serif;
    font-size: clamp(0.6rem, 1.5vw, 0.72rem);
    letter-spacing: 0.38em;
    padding: 14px 52px;
    border-radius: 40px;
    cursor: none;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
    text-transform: uppercase;
    animation: btnAppear 2.5s ease forwards;
    opacity: 0;
  }
  @keyframes btnAppear { 0%,60%{opacity:0} 100%{opacity:1} }
  #enter-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(180,220,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }
  #enter-btn:hover {
    border-color: rgba(140,200,255,0.55);
    color: #fff;
    box-shadow: 0 0 30px rgba(100,180,255,0.18), inset 0 0 20px rgba(100,180,255,0.06);
  }
  #enter-btn:hover::before { transform: translateX(100%); }
  #enter-btn:active { transform: scale(0.97); }

  /* Custom cursor — atom dot */
  #cursor {
    position: fixed; z-index: 9999;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, rgba(0,230,255,0.9) 50%, transparent 100%);
    box-shadow: 0 0 10px rgba(0,230,255,0.8), 0 0 20px rgba(0,230,255,0.3);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 0.08s linear;
  }

  /* Ambient glow blobs */
  .blob {
    position: fixed; border-radius: 50%;
    pointer-events: none; filter: blur(90px);
    animation: blobDrift var(--t, 20s) ease-in-out infinite alternate;
  }
  @keyframes blobDrift { from { transform: translate(0,0); } to { transform: translate(var(--tx,30px),var(--ty,20px)); } }
</style>

  <div id="title">The Lighthouse</div>
  <div id="tagline">Illuminate · Collect · Connect · Contribute</div>
  <button id="enter-btn" onclick="openApp()">Enter the Lighthouse</button>
</div>

<!-- OVERLAY for transition -->
<div id="overlay" style="position:fixed;inset:0;background:#02030a;opacity:0;pointer-events:none;z-index:100;transition:opacity 0.8s ease;"></div>

<script>
// ─── CURSOR ───
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

// ─── STARFIELD ───
const bg = document.getElementById('bg');
const bctx = bg.getContext('2d');
bg.width = window.innerWidth; bg.height = window.innerHeight;
window.addEventListener('resize', () => { bg.width = window.innerWidth; bg.height = window.innerHeight; });

const stars = Array.from({length: 180}, () => ({
  x: Math.random() * bg.width,
  y: Math.random() * bg.height,
  r: Math.random() * 1.3 + 0.2,
  t: Math.random() * Math.PI * 2,
  sp: 0.004 + Math.random() * 0.007,
}));

let bgT = 0;
function drawBG() {
  bctx.clearRect(0, 0, bg.width, bg.height);
  bgT += 0.016;
  stars.forEach(s => {
    s.t += s.sp;
    const op = 0.1 + Math.abs(Math.sin(s.t)) * 0.7;
    bctx.beginPath(); bctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    bctx.fillStyle = `rgba(200,215,255,${op})`; bctx.fill();
  });
  requestAnimationFrame(drawBG);
}
drawBG();

// ─── ENTER APP ───
function openApp() {
  const overlay = document.getElementById('overlay');
  overlay.style.pointerEvents = 'all';
  overlay.style.opacity = '1';
  // Open the lighthouse app HTML in same tab after fade
  setTimeout(() => {
    window.location.href = 'the-lighthouse-app.html';
  }, 850);
}

// Also allow clicking logo directly
document.getElementById('logo-img').addEventListener('click', openApp);
</script>
